name: Test HTML

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Check HTML file exists
        run: |
          if [ -f index.html ]; then
            echo "HTML file exists ✅"
          else
            echo "HTML file missing ❌"
            exit 1
          fi